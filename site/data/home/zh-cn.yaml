hero:
  eyebrow: 专注绘本创作
  title: 把一个想法，做成一本真正能翻阅的绘本
  description: Lumi 把故事、角色与场景设定、分镜、画面候选和导出放进同一个本地项目。AI 帮你向前推进，故事怎么讲、哪一版留下，始终由你决定。
  primary: 下载 Lumi
  secondary: 查看使用教程
  note: 目前支持 macOS Apple Silicon 与 Windows x64 · AI 功能需要连接模型服务
  floating:
    - 故事自己定
    - 角色不跑偏
    - 过程可修改
    - 作品留在本地

process:
  eyebrow: 从灵感到成书
  title: 绘本创作，不必在一堆工具之间来回搬运
  description: 每一步既可以手动完成，也可以让 AI 提供初稿。生成结果不会替你做最终决定。
  steps:
    - title: 说出故事想法
      body: 从一句话开始，确定主角、愿望、阻碍与变化。
    - title: 完成剧情与章节
      body: 编写、导入或生成章节，随时回到旧版本继续修改。
    - title: 建立视觉设定
      body: 把角色、地点、道具和整体画风整理为可复用参考。
    - title: 拆成漫画分镜
      body: 将正文变成可编辑的画面段落，调整镜头、动作与节奏。
    - title: 生成并挑选画面
      body: 带上设定参考生成图片，在多个候选中选择当前版本。
    - title: 连续预览与导出
      body: 检查整章阅读节奏，导出单章或完整项目的原图 ZIP 与 A4 PDF。

formats:
  eyebrow: 五种绘本形式
  title: 同一个故事，可以长成五种不同的绘本
  description: 创建项目时选择最适合的叙事方式，Lumi 会为它固定对应的页面结构、画面比例与生成规则。
  items:
    - key: classic
      title: 经典图文
      body: 一幅主画面配少量正文，让图像和文字一起推动故事。
      detail: 支持多种画面比例与大图少字
    - key: wordless
      title: 无字绘本
      body: 完全依靠动作、表情和场景变化推进故事，让每一页都用画面说话。
      detail: 纯视觉连续叙事
    - key: interactive
      title: 互动绘本
      body: 每页加入一条简短、适龄的互动问题或指令，让孩子参与故事。
      detail: 找一找 · 做选择 · 猜一猜 · 跟着做
    - key: comic
      title: 漫画故事
      body: 用多格画面、气泡对白与连续动作，呈现更紧凑的情节推进。
      detail: 四格漫画或页漫版式
    - key: vertical
      title: 条漫
      body: 使用固定 1:3 纵向画幅，让镜头与剧情按从上到下的节奏连续展开。
      detail: 为手机纵向阅读优化

features_eyebrow: 一个完整工作台
features_title: 让创作连续，也让每一次尝试都能回头
features:
  - eyebrow: 故事不会散落
    title: 从剧情简介到章节正文，都在同一个故事里
    body: 手动写作、导入现有稿件、AI 续写或批量规划章节，不再需要在聊天窗口和文档之间反复复制背景。
    bullets:
      - 故事简介与章节正文分开维护
      - 支持 TXT、Markdown 导入
      - 正文版本可比较、可恢复
    demo: story
  - eyebrow: 视觉保持一致
    title: 让角色、场景与道具成为共同参考
    body: 将绘本的视觉基础集中放在设定工作区。上传现有图片，或生成设定图，再在后续画面中反复引用。
    bullets:
      - 角色、场景、道具分类管理
      - 同一设定项保留多个图片版本
      - 分镜出图时选择相关参考
    demo: premise
  - eyebrow: 画面可以继续改
    title: 分镜、提示词和图片候选都不是一次性结果
    body: 每个画面段落都有自己的分镜脚本和图片候选。先调整叙事，再生成画面；不满意就换一版，不必推倒整个章节。
    bullets:
      - 调整镜头、动作、对白与顺序
      - 单张或批量生成画面
      - 候选图片一键设为当前版本
    demo: storyboard
  - eyebrow: 尝试不会抹掉过去
    title: 保存版本，也保存重新选择的余地
    body: 故事、分镜、图片和提示词都保留历史。刷新页面或重新打开项目后，后台任务和当前创作状态仍能继续恢复。
    bullets:
      - 章节漫画快照可预览和恢复
      - 失败任务可查看原因并重试
      - 当前采用版本始终清晰可见
    demo: local

modes:
  eyebrow: 两种开始方式
  title: 想先看到雏形，或想一步步控制，都可以
  description: 两种方式最后都会进入同一个可编辑工作台，没有不可修改的“一键成品”。
  items:
    - badge: 快速开始
      title: YOLO 快速创作
      body: 输入最小故事创意，自动建立故事、剧情简介、设定、分镜和首张画面，再继续细化。
      best_for: 适合想快速看到故事雏形的家长和创作者
    - badge: 精细控制
      title: 手动创作
      body: 从空白项目或已有稿件开始，自己决定何时编辑、导入、生成和采用结果。
      best_for: 适合已有构思或希望逐步控制的个人创作者

trust:
  eyebrow: 本地优先
  title: 项目是你的文件夹，不是某个网站里的孤岛
  body: 每本绘本都保存在你选择的本机目录中，可以整体移动、复制和备份。Lumi 只记录最近打开的位置，不会把完整项目上传到自己的云端。
  bullets:
    - 故事、图片和项目数据库一起保存
    - 模型密钥通过操作系统安全存储保护
    - 只有执行生成所需的内容会发送给你选择的模型服务商

faq_title: 开始之前，你可能想知道
faq:
  - question: 不会画画，也能使用 Lumi 吗？
    answer: 可以。你可以先说清楚主角、愿望和故事变化，让 Lumi 提供故事、设定与分镜初稿，再由你选择、编辑和重新生成。
  - question: Lumi 支持哪些系统？
    answer: 当前桌面安装包支持 macOS Apple Silicon 和 Windows x64。安装教程会说明下载文件、校验方式和首次启动时可能遇到的系统提醒。
  - question: AI 功能使用哪些模型服务？
    answer: 当前可以连接阿里云百炼或 Cloudflare AI Gateway。模型调用可能由对应服务商计费，Lumi 不代收模型费用。
  - question: 我的绘本项目保存在哪里？
    answer: 项目保存在你选择的本机文件夹中，包含 STORY.md、项目数据库、图片与必要的内部文件，可以整体备份或移动。
  - question: 生成结果不满意怎么办？
    answer: 你可以编辑故事或分镜、重新生成图片、切换候选，并在支持的工作区查看或恢复历史版本，不需要覆盖掉上一版。

closing:
  title: 让今晚想到的故事，真正拥有自己的画面
  body: 下载 Lumi，从一个想法开始；或者先用十分钟看完第一本绘本教程。
