prompts:
  codex: |-
    以下小说，创建一个条漫(就是韩国的webtton)，分成五个章节，实现第一个章节的所有图片，第一个章节你自动分镜分页

    <备注>
    Webtoon（웹툰）是起源于韩国的一种网络漫画形式，也被称为“条漫”或“韩式网络漫画”。
    它最大的特点是：专门为手机阅读设计，通过上下滑动屏幕来阅读漫画。
    </备注>

    XXX: 不能使用Lumi插件
    XXX: 对白直接通过 imagegen 生成
  lumi: |-
    以下小说，使用 @Lumi 绘本创作（开发版） 创建一个条漫，分成五个章节，实现第一个章节的所有图片，第一个章节你自动分镜分页
