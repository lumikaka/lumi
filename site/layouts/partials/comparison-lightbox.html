<dialog class="comparison-lightbox" data-comparison-lightbox aria-labelledby="comparison-lightbox-title">
  <div class="comparison-lightbox__toolbar"><h2 id="comparison-lightbox-title" data-comparison-image-title></h2><div class="comparison-lightbox__actions"><button class="button button--light comparison-zoom" type="button" data-comparison-zoom aria-pressed="false" aria-controls="comparison-image-viewport">{{ .Params.copy.actual_size }}</button><form method="dialog"><button class="button button--light" autofocus>{{ .Params.copy.close }}</button></form></div></div>
  <div class="comparison-lightbox__viewport" id="comparison-image-viewport" tabindex="0" role="region" aria-labelledby="comparison-lightbox-title"><img data-comparison-image alt=""></div>
  <p>{{ .Params.copy.lightbox_hint }} <a data-comparison-original target="_blank" rel="noopener">{{ .Params.copy.open_image }}</a></p>
</dialog>
