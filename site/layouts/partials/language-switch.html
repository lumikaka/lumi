{{ $current := . }}
<div class="language-switch">
  {{ range .AllTranslations }}
    {{ if ne .Language.Lang $.Site.Language.Lang }}
      <a href="{{ partial "relative-url.html" (dict "Page" $current "URL" .RelPermalink) }}" hreflang="{{ .Language.Locale | default .Language.Lang }}" lang="{{ .Language.Locale | default .Language.Lang }}" aria-label="{{ i18n "switch_language" }}">{{ .Language.Label | default .Language.Lang }}</a>
    {{ end }}
  {{ end }}
</div>
