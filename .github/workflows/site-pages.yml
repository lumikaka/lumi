name: Site Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.164.0
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        run: |
          set -euo pipefail

          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          download_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/hugo"

          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "${download_url}"
          tar -C "${install_dir}" -xzf "${RUNNER_TEMP}/${archive}"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Log Hugo version
        run: hugo version

      - name: Build site
        run: |
          hugo \
            --source site \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${RUNNER_TEMP}/hugo_cache"

      - name: Verify generated routes and relative assets
        run: ./site/scripts/check-build.sh site/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/public

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
