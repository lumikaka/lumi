name: Desktop macOS

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      build_updater:
        required: true
        type: boolean
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Preview bundle version, for example v0.1.2; the selected branch is built without updater artifacts"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release macOS Apple Silicon app
    runs-on: macos-15
    env:
      APPLE_SIGNING_IDENTITY: "${{ vars.APPLE_SIGNING_IDENTITY || '-' }}"
      APPLE_CERTIFICATE_BASE64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
      APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
      TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
      CARGO_TERM_COLOR: always

    steps:
      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_BUILD_UPDATER: ${{ inputs.build_updater }}
          INPUT_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          tag="$INPUT_RELEASE_TAG"
          if [ -n "$INPUT_CHECKOUT_REF" ]; then
            checkout_ref="$INPUT_CHECKOUT_REF"
            updater="$INPUT_BUILD_UPDATER"
          else
            checkout_ref="$EVENT_REF"
            updater="false"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must look like v0.1.0." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "updater=${updater}" >> "$GITHUB_OUTPUT"

      - name: Checkout build ref
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Validate desktop assets
        shell: bash
        run: |
          set -euo pipefail

          for icon in \
            rel/app/src-tauri/icons/32x32.png \
            rel/app/src-tauri/icons/128x128.png \
            rel/app/src-tauri/icons/128x128@2x.png \
            rel/app/src-tauri/icons/icon.png
          do
            color_type="$(od -An -tu1 -j25 -N1 "$icon" | tr -d '[:space:]')"
            if [ "$color_type" != "6" ]; then
              echo "Tauri icon must be an RGBA PNG (PNG color type 6): $icon" >&2
              exit 1
            fi
          done

          test -f rel/app/src-tauri/icons/AppIcon.icns
          test -x rel/app/tauri.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            rel/app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rel/app/src-tauri
          key: aarch64-apple-darwin

      - name: Import optional Apple signing certificate
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "No Apple certificate configured; using ad-hoc signing."
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are required when APPLE_CERTIFICATE_BASE64 is set." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/lumi-signing.p12"
          keychain_path="$RUNNER_TEMP/lumi-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Install pinned Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir rel/app install --frozen-lockfile
          test "$(pnpm --dir rel/app exec tauri --version)" = "tauri-cli 2.8.0"

      - name: Test desktop launcher
        shell: bash
        working-directory: rel/app/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --target aarch64-apple-darwin
          cargo test --locked --features desktop-updater --target aarch64-apple-darwin

      - name: Build Lumi app
        shell: bash
        env:
          LUMI_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          LUMI_DESKTOP_UPDATER: ${{ steps.release.outputs.updater == 'true' && '1' || '0' }}
        run: make desktop-build

      - name: Verify bundle and signing
        shell: bash
        run: |
          set -euo pipefail

          app_path="rel/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lumi.app"
          backend_path="${app_path}/Contents/Resources/backend/lumi_web"

          test -d "$app_path"
          test -x "$backend_path"
          test "$(lipo -archs "$backend_path")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_path}/Contents/Info.plist")" = "${{ steps.release.outputs.version }}"
          codesign --verify --deep --strict "$app_path"
          codesign -dv --verbose=2 "$app_path"

      - name: Smoke test packaged app
        shell: bash
        run: |
          set -euo pipefail

          app_path="$PWD/rel/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lumi.app"
          log_path="$HOME/Library/Logs/Lumi/lumi.log"
          mkdir -p "$(dirname "$log_path")"
          touch "$log_path"
          starting_lines="$(wc -l < "$log_path" | tr -d ' ')"

          cleanup() {
            osascript -e 'tell application "Lumi" to quit' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          open -n --env LOG_LEVEL=info "$app_path"

          url=""
          for _ in $(seq 1 120); do
            url="$(tail -n "+$((starting_lines + 1))" "$log_path" | sed -n 's/.*Lumi backend ready at \(http:\/\/127\.0\.0\.1:[0-9][0-9]*\).*/\1/p' | tail -n 1)"
            if [ -n "$url" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$url" ]; then
            echo "Packaged Lumi app did not report a ready URL." >&2
            tail -n 200 "$log_path" >&2
            exit 1
          fi

          health="$(curl --fail --silent --show-error "${url}/api/v1/health")"
          echo "$health" | grep -F '"success":true' >/dev/null
          echo "$health" | grep -F '"status":"ok"' >/dev/null
          echo "$health" | grep -F '"database":"connected"' >/dev/null

          browser_opened=false
          for _ in $(seq 1 30); do
            if tail -n "+$((starting_lines + 1))" "$log_path" | grep -F "opened Lumi in system browser at ${url}" >/dev/null; then
              browser_opened=true
              break
            fi
            sleep 1
          done

          if [ "$browser_opened" != "true" ]; then
            echo "Packaged Lumi app did not successfully invoke the system browser." >&2
            tail -n 200 "$log_path" >&2
            exit 1
          fi

          cleanup
          trap - EXIT

          for _ in $(seq 1 30); do
            if ! pgrep -f "${app_path}/Contents/Resources/backend/lumi_web" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "lumi_web remained running after Lumi quit." >&2
          pgrep -af "${app_path}/Contents/Resources/backend/lumi_web" >&2 || true
          exit 1

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            rel/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lumi.app \
            Lumi-macos-aarch64.app.zip
          shasum -a 256 Lumi-macos-aarch64.app.zip > Lumi-macos-aarch64.app.zip.sha256

      - name: Package updater assets
        if: ${{ steps.release.outputs.updater == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          updater_bundles=(rel/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if [ "${#updater_bundles[@]}" -ne 1 ]; then
            echo "Expected one macOS updater bundle, found ${#updater_bundles[@]}." >&2
            exit 1
          fi
          updater_bundle="${updater_bundles[0]}"
          test -s "${updater_bundle}.sig"
          cp "$updater_bundle" Lumi-macos-aarch64.app.tar.gz
          cp "${updater_bundle}.sig" Lumi-macos-aarch64.app.tar.gz.sig

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-macos-aarch64
          path: |
            Lumi-macos-aarch64.app.zip
            Lumi-macos-aarch64.app.zip.sha256
            Lumi-macos-aarch64.app.tar.gz
            Lumi-macos-aarch64.app.tar.gz.sig
          if-no-files-found: error
