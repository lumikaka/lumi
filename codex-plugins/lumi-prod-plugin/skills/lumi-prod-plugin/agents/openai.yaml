interface:
  display_name: "Lumi Desktop"
  short_description: "Use an authorized local Lumi project"
  default_prompt: "Use $lumi-prod-plugin to inspect my authorized Lumi project via MCP."

dependencies:
  tools:
    - type: "mcp"
      value: "lumi-prod-plugin"
      description: "Local project-scoped Lumi MCP server"
      transport: "streamable_http"
      url: "http://127.0.0.1:32323/mcp"
