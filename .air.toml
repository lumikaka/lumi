root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/lumi_web ./cmd/lumi_web"
entrypoint = ["./tmp/lumi_web"]
include_ext = ["go"]
exclude_dir = ["tmp", "web"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
